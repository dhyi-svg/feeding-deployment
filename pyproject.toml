[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "feeding_deployment"
version = "0.1.0"
description = "Code for 2024 EmPRISE lab feeding deployment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
   "openai",
   "anthropic",
   "matplotlib",
   "numpy",
]

[project.optional-dependencies]
robot = [
   "pybullet_helpers@git+https://github.com/Princeton-Robot-Planning-and-Learning/prpl-mono.git#subdirectory=pybullet-helpers",
   "relational_structs@git+https://github.com/Princeton-Robot-Planning-and-Learning/prpl-mono.git#subdirectory=relational-structs",
   "prpl-utils@git+https://github.com/Princeton-Robot-Planning-and-Learning/prpl-mono.git#subdirectory=prpl-utils",
   "tomsutils@git+https://github.com/tomsilver/toms-utils.git",
   "pyaudio",
   "imageio[ffmpeg]",
   "pin",
   "ruckig",
   "opencv-python",
   "multiprocess",
   "scikit-learn",
   "paramiko",
   "pyyaml",
   "rospkg",
   "catkin_pkg",
   "empy",
   "defusedxml",
   "serial",
   "twisted",
   "pyOpenSSL",
   "autobahn",
   "tornado",
   "pymongo",
]

develop = [
    "black",
    "docformatter",
    "isort",
    "mypy",
    "pylint>=2.14.5",
    "pytest-pylint>=0.18.0",
    "pytest>=7.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pybullet_helpers = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
py_version = 310
profile = "black"
multi_line_output = 2
skip_glob = ["venv/*"]
split_on_trailing_comma = true

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = [
    "venv/*",
    # NOTE (found during the ROS2 migration, fixed here as a small
    # pre-existing-bug fix, not part of the migration itself): these three
    # paths never matched any real file/directory in this repo (verified
    # with `ls` -- the actual paths are one level deeper, under
    # control/ and perception/ respectively, and perception_interface.py
    # lives under interfaces/, not integration/). mypy's `exclude` was
    # therefore silently excluding nothing since whenever this list was
    # written, presumably predating a directory reorg. Corrected to the
    # real paths below so these hardware-coupled files are actually
    # skipped, matching the documented intent in CLAUDE.md ("mypy excludes
    # ... hardware-coupled, not meaningfully type-checkable").
    "src/feeding_deployment/control/robot_controller/*",
    "src/feeding_deployment/perception/head_perception/*",
    "src/feeding_deployment/interfaces/perception_interface.py",
]

[[tool.mypy.overrides]]
module = [
    "pybullet.*",
    "pyaudio.*",
    "scipy.*",
    # Added for the ROS2 (rclpy/Jazzy) migration: none of these ship
    # inline type stubs as of this writing, so mypy can't resolve them
    # without these overrides (mirrors the pattern already used above for
    # pybullet/pyaudio/scipy).
    "rclpy.*",
    "rcl_interfaces.*",
    "launch.*",
    "launch_ros.*",
    "ament_index_python.*",
    "tf2_ros.*",
    "tf2_geometry_msgs.*",
    "cv_bridge.*",
    "message_filters.*",
    "rosbridge_library.*",
    # Generated at colcon-build time by rosidl; not resolvable by mypy
    # without a real ROS2 workspace build (see ROS2_MIGRATION_NOTES.md
    # section 3 for the colcon build status of this repo).
    "feeding_deployment_msgs.*",
]
ignore_missing_imports = true
