# Config for microwave/placement/place_move.py (keys = the command-line options with _; the command line wins;
# --execute is never read from here). Metres / degrees, base_link (+x forward, +z up, origin at the arm base).
xyz: [0.55, 0.00, 0.30]    # PLACEHOLDER -- Part 2 (microwave perception) will supply the placement point
target: container          # container (held container centre) | tool (tool_frame, between the fingertips)
# grasp_offset: [0.0, 0.0, 0.10]   # tool frame -> container centre, in the TOOL frame. MEASURE before use.
roll_deg: -90              # wrist camera LEFT seen from behind the wrist (user-confirmed 10-23)
# yaw_deg: 0               # approach heading; default = the current one
# max_deviation: 0.05      # m off the straight line; default: not gated (only logged)
z_min: 0.12
z_max: 0.75
speed_scale: 0.67
