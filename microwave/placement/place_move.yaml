# Config for place_move.py. Metres / degrees, arm_base_link. Defaults and meaning: place_move.DEFAULTS.
# Measured on the rig 10-30: this staging pose shows the whole opening from the wrist camera (roll 0). Redo per setup.
staging_joints_deg: [2.3, 53.9, 177.4, -140.3, 0.8, 104.2, 92.3]
cavity_method: opening     # opening_cavity.py; the scene-camera method, also run on the wrist camera for now
roll_deg: -90              # wrist camera LEFT seen from behind the wrist (user-confirmed 10-23)
# Container bottom this far above the support through the door and when impedance starts. Above the 4.3-5.7 cm
# impedance sag seen on this arm (10-26), so the settle cannot press the container on the floor.
insert_above_m: 0.07
# UNVERIFIED ON THIS ARM. vz_stop, lower_speed: the reference's flatbot values. kq/zeta/torque_limit unset = the
# driver's starting point (sheppy_arm.IMPEDANCE), which sagged 4.3 cm here. Tune from <log>/descent.csv.
vz_stop: -0.01
lower_speed: 0.02
max_settle_sag_m: 0.06
max_tilt_deg: 3.0
overtravel_m: 0.01         # the hand stops this far below the expected contact
